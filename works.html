<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0c0e1a 0%, #1a1c2e 50%, #0c0e1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* 粒子背景 */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: rgba(15, 17, 30, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(100, 120, 200, 0.2);
            z-index: 100;
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-250px);
        }

        .sidebar-toggle {
            position: absolute;
            right: -40px;
            top: 20px;
            width: 40px;
            height: 40px;
            background: rgba(100, 120, 200, 0.3);
            border: none;
            border-radius: 0 8px 8px 0;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(100, 120, 200, 0.15);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #8892b0;
        }

        .nav-menu {
            padding: 20px 0;
        }

        .nav-item {
            display: block;
            padding: 12px 25px;
            color: #8892b0;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border-left-color: #667eea;
        }

        .nav-item i {
            margin-right: 10px;
            width: 20px;
            display: inline-block;
        }

        /* 主内容区 */
        .main-content {
            margin-left: 250px;
            padding: 40px;
            position: relative;
            z-index: 1;
            transition: margin-left 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p {
            color: #8892b0;
            font-size: 14px;
        }

        /* 视频容器 */
        .video-container {
            background: rgba(20, 22, 40, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 120, 200, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 比例 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            margin-top: 15px;
            padding: 0 5px;
        }

        .video-title h2 {
            font-size: 18px;
            color: #e0e0e0;
        }

        .video-title p {
            font-size: 13px;
            color: #8892b0;
            margin-top: 5px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-250px);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>

    <!-- 侧边栏 -->
    <nav class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="sidebar-header">
            <div class="avatar">👤</div>
            <h2>我的主页</h2>
            <p>个人作品集</p>
        </div>
        <div class="nav-menu">
            <a href="index.html" class="nav-item"><i>🏠</i>首页</a>
            <a href="about.html" class="nav-item"><i>👤</i>关于我</a>
            <a href="works.html" class="nav-item active"><i>🎬</i>我的作品</a>
            <a href="contact.html" class="nav-item"><i>📧</i>联系我</a>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent">
        <div class="page-header">
            <h1>我的作品</h1>
            <p>这里展示我创作的内容</p>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <iframe 
                    src="//player.bilibili.com/player.html?isOutside=true&aid=115347646704745&bvid=BV18x4y1E7kR&cid=29876543210&p=1" 
                    scrolling="no" 
                    border="0" 
                    frameborder="no" 
                    framespacing="0" 
                    allowfullscreen="true">
                </iframe>
            </div>
            <div class="video-title">
                <h2>无数次时间跳跃换来的真理！</h2>
                <p>来源：哔哩哔哩</p>
            </div>
        </div>
    </main>

    <!-- particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 粒子背景初始化
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: '#667eea' },
                shape: { type: 'circle' },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: { enable: true, distance: 150, color: '#667eea', opacity: 0.2, width: 1 },
                move: { enable: true, speed: 2, direction: 'none', random: true, straight: false, out_mode: 'out' }
            },
            interactivity: {
                detect_on: 'canvas',
                events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' }, resize: true },
                modes: { grab: { distance: 140, line_linked: { opacity: 0.5 } }, push: { particles_nb: 4 } }
            },
            retina_detect: true
        });

        // 侧边栏切换
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleBtn = document.getElementById('sidebarToggle');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        });
    </script>
</body>
</html>
