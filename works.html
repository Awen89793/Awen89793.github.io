<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品 - Awen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-top: 80px; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: white; border-bottom: 1px solid var(--border); z-index: 1000; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; height: 64px; max-width: 960px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary-dark); text-decoration: none; }
        .nav-links { display: flex; gap: 8px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; padding: 8px 16px; border-radius: 8px; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-dark); background: #eef2ff; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; flex: 1; }
        .empty-state { background: var(--card); padding: 60px 20px; border-radius: 16px; border: 1px solid var(--border); }
        .empty-state i { font-size: 50px; color: var(--muted); margin-bottom: 20px; }
        .empty-state h2 { margin-bottom: 10px; }
        .empty-state p { color: var(--muted); }
        .site-footer { text-align: center; padding: 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); background: var(--card); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Awen</a>
            <ul class="nav-links">
                <li><a href="index.html">主页</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="works.html" class="active">作品</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="empty-state">
            <i class="fas fa-folder-open"></i>
            <h2>暂无作品</h2>
            <p>这里正在建设中，敬请期待我的第一个项目！</p>
        </div>
    </div>
    <footer class="site-footer">
        网站由 GitHub 托管
    </footer>
</body>
</html>
