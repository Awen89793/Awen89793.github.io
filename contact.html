<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系方式 - Awen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --sidebar-width: 220px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--card); border-right: 1px solid var(--border); z-index: 1000; display: flex; flex-direction: column; padding: 24px 16px; }
        .sidebar .logo { font-size: 20px; font-weight: 700; color: var(--primary-dark); text-decoration: none; margin-bottom: 32px; }
        .sidebar .nav-links { display: flex; flex-direction: column; gap: 8px; list-style: none; flex: 1; }
        .sidebar .nav-links a { text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; padding: 10px 16px; border-radius: 8px; transition: all 0.2s; }
        .sidebar .nav-links a:hover, .sidebar .nav-links a.active { color: var(--primary-dark); background: #eef2ff; }
        .main { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; flex: 1; }
        .card { background: var(--card); padding: 50px 30px; border-radius: 16px; border: 1px solid var(--border); }
        .email-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--primary); color: white; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-top: 20px; transition: 0.3s; }
        .email-btn:hover { background: var(--primary-dark); transform: translateY(-3px); }
        .site-footer { text-align: center; padding: 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); background: var(--card); }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; align-items: center; padding: 12px 16px; }
            .sidebar .logo { margin-bottom: 0; margin-right: 16px; }
            .sidebar .nav-links { flex-direction: row; flex: unset; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="index.html" class="logo">Awen</a>
        <ul class="nav-links">
            <li><a href="index.html">主页</a></li>
            <li><a href="about.html">关于</a></li>
            <li><a href="works.html">作品</a></li>
            <li><a href="contact.html" class="active">联系方式</a></li>
        </ul>
    </nav>
    <div class="main">
        <div class="container">
            <div class="card">
                <h1>联系我</h1>
                <p>如果你有任何问题或建议，欢迎随时给我发邮件。</p>
                <a href="mailto:Yinquwen@hotmail.com" class="email-btn">
                    <i class="fas fa-envelope"></i> Yinquwen@hotmail.com
                </a>
            </div>
        </div>
        <footer class="site-footer">
            网站由 GitHub 托管
        </footer>
    </div>
</body>
</html>
