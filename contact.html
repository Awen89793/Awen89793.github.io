<!DOCTYPE html>

<body>
  <button class="menu-toggle" aria-label="打开菜单">☰</button>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <a href="index.html" class="logo">Awen</a>
    <ul class="nav-links">
      <li><a href="index.html">主页</a></li>
      <li><a href="about.html">关于</a></li>
      <li><a href="works.html">作品</a></li>
      <li><a href="contact.html" class="active">联系</a></li>
    </ul>
  </aside>

  <main>
    <div class="hero">
      <img src="avatar.png" alt="Awen 头像" class="avatar">
      <h1>联系我</h1>
      <p>欢迎通过以下方式与我交流</p>
    </div>

    <div class="section">
      <h2>联系方式</h2>
      <ul class="contact-list">
        <li><strong>QQ：</strong>3153721700</li>
        <li><strong>微信：</strong>Awen18127604795</li>
        <li><strong>B站：</strong>UID 3546957062605470（休比-文A）</li>
        <li><strong>邮箱：</strong>Yinquwen@hotmail.com</li>
      </ul>
    </div>
  </main>

  <footer>
    <p>© 2026 Awen 的个人网站</p>
  </footer>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    menuToggle.addEventListener('click', () => {
      if (sidebar.classList.contains('open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    });

    overlay.addEventListener('click', closeSidebar);
  </script>
</body>
