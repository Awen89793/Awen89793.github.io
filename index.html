<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awen 的个人网站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <button class="menu-toggle" aria-label="打开菜单">☰</button>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="avatar.png" alt="Awen 头像" class="sidebar-avatar">
      <a href="index.html" class="logo">Awen</a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">主页</a></li>
      <li><a href="about.html">关于</a></li>
      <li><a href="works.html">作品</a></li>
      <li><a href="contact.html">联系</a></li>
    </ul>
  </aside>

  <main>
    <div class="hero reveal">
      <img src="avatar.png" alt="Awen 头像" class="avatar">
      <h1>你好，我是 Awen</h1>
      <p>一名正在探索互联网的初学者</p>
      <span class="tag">学习中 · 建设中 · 持续更新</span>
    </div>

    <div class="section reveal">
      <h2>关于这个网站</h2>
      <p>这是我使用 HTML、CSS 和 GitHub Pages 搭建的个人网站。目前网站还在完善中，后续会陆续添加更多学习笔记、项目作品和个人分享。</p>
    </div>

    <div class="section reveal">
      <h2>最近在做</h2>
      <p>学习网页基础、配置 GitHub Pages、整理个人作品，并尝试把网站做得更完整、更美观。</p>
    </div>
  </main>

  <footer class="reveal">
    <p>© 2026 Awen 的个人网站
代码由github托管</p>
  </footer>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    menuToggle.addEventListener('click', () => {
      if (sidebar.classList.contains('open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    });

    overlay.addEventListener('click', closeSidebar);

    const revealElements = document.querySelectorAll('.reveal');

    function checkReveal() {
      const trigger = window.innerHeight * 0.92;

      revealElements.forEach((el, index) => {
        const top = el.getBoundingClientRect().top;

        if (top < trigger) {
          setTimeout(() => {
            el.classList.add('visible');
          }, index * 120);
        }
      });
    }

    window.addEventListener('scroll', checkReveal);
    window.addEventListener('load', checkReveal);
    checkReveal();
  </script>
</body>
</html>
