<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    /* 基础重置与排版 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f5; 
      color: #333; 
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      text-align: center;
    }
    /* 头像区域 */
    .avatar {
      width: 100px; height: 100px;
      background: #eee;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: #999;
    }
    /* 文字与按钮排版 */
    h1 { font-size: 24px; margin-bottom: 10px; color: #111; }
    p { color: #666; margin-bottom: 30px; font-size: 15px; }
    .links a {
      display: inline-block;
      margin: 5px 8px;
      padding: 10px 20px;
      background: #111; color: #fff;
      text-decoration: none; border-radius: 6px;
      font-size: 14px; transition: 0.3s;
    }
    .links a:hover { opacity: 0.8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
  <div class="avatar">
  <img src="https://www.kdocs.cn/l/cjYwrcGxfI7c.jpg"> alt="头像" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
  </div>
 
    
    <h1>你好，我是 [休比—文A]</h1>
    <p>这是我的个人主页 / 作品集 / 博客。<br>欢迎来到我的互联网小角落。</p>
    
    <div class="links">
      <a href="#">我的博客</a>
      <a href="#">GitHub</a>
      <a href="#">联系我</a>
    </div>
  </div>
</body>
  </html>
