<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awen 的个人网站 - 主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; height: 64px; max-width: 960px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary-dark); text-decoration: none; }
        .nav-links { display: flex; gap: 8px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-dark); background: #eef2ff; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; text-align: center; padding: 20px; }
        .hero-content { max-width: 600px; }
        .hero h1 { font-size: 36px; margin-bottom: 16px; }
        .hero p { font-size: 18px; opacity: 0.9; margin-bottom: 32px; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 12px 24px; border-radius: 10px; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .btn-white { background: white; color: var(--primary-dark); }
        .btn-white:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Awen</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">主页</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="works.html">作品</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>
    <section class="hero">
        <div class="hero-content">
            <h1>你好，我是 Awen</h1>
            <p>一名正在探索数字世界的互联网初学者。</p>
            <div class="btn-group">
                <a href="about.html" class="btn btn-white">了解更多</a>
                <a href="contact.html" class="btn btn-white" style="background:transparent; border:2px solid white; color:white;">联系我</a>
            </div>
        </div>
    </section>
</body>
</html>
