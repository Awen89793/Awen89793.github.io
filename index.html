<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awen的主页 - 学习中</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #6366f1; /* 保持和你其他页面一致的紫色调 */
            --primary-dark: #4f46e5; 
            --bg: #0f172a; /* 深色背景 */
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg);
            color: var(--text); 
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- 侧边栏样式 (保持不变) --- */
        .sidebar { 
            position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border); 
            z-index: 1000; 
            display: flex; flex-direction: column; padding: 40px 20px; align-items: center; 
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .avatar { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin-bottom: 20px; border: 3px solid var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .sidebar .logo { font-size: 22px; font-weight: 700; color: white; text-decoration: none; margin-bottom: 40px; letter-spacing: 1px; }
        
        .sidebar .nav-links { display: flex; flex-direction: column; gap: 10px; list-style: none; width: 100%; }
        .sidebar .nav-links a { 
            text-decoration: none; color: var(--muted); font-size: 16px; font-weight: 500; 
            padding: 12px 20px; border-radius: 10px; transition: all 0.3s ease; 
            display: block; text-align: left; padding-left: 30px;
        }
        .sidebar .nav-links a:hover, .sidebar .nav-links a.active { 
            color: white; background: var(--primary); transform: translateX(5px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* --- 主内容区域 --- */
        .main-content {
            margin-left: var(--sidebar-width); /* 给侧边栏留位置 */
            flex: 1;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 动态背景 Canvas */
        #particles-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 头部文字区域 */
        header { margin-bottom: 60px; }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1s ease-out;
        }

        .typing-container {
            font-size: 1.2rem;
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace; /* 代码风格字体 */
            min-height: 1.5em;
        }

        /* 卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary);
        }

        .card h3 { color: white; margin-bottom: 10px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;}
        .card p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
        
        /* 装饰性的小图标颜色 */
        .card i { color: var(--primary); }

        /* 动画关键帧 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            :root { --sidebar-width: 0px; } /* 手机上隐藏侧边栏，改为汉堡菜单逻辑（此处简化处理，假设手机也显示或你需要加汉堡按钮） */
            /* 为了简单起见，这里让侧边栏在手机上变成底部导航或者隐藏，这里暂且设为隐藏，内容全宽 */
            .sidebar { display: none; } 
            .main-content { margin-left: 0; }
            h1 { font-size: 2.5rem; }
            
            /* 如果你想在手机上也能打开侧边栏，需要加一个汉堡按钮，参考你之前的 about.html 代码 */
        }
    </style>
</head>

    <script>
        // --- 打字机效果脚本 ---
        const textToType = "一名正在努力入门的 Web 前端新手 / 抄作业大师 / 充满好奇心的探索者";
        const typingElement = document.getElementById('typing-text');
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                typingElement.innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, 100); // 打字速度
            }
        }
        window.onload = typeWriter;

        // --- 粒子背景脚本 (简化版) ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.01; // 慢慢消失
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(99, 102, 241, 0.5)'; // 紫色粒子
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 50; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                // 简单的连线
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(99, 102, 241, ${1 - distance/100})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
