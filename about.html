<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 Awen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-toggle" aria-label="打开菜单">☰</button>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <a href="index.html" class="logo">Awen</a>
    <ul class="nav-links">
      <li><a href="index.html">主页</a></li>
      <li><a href="about.html" class="active">关于</a></li>
      <li><a href="works.html">作品</a></li>
      <li><a href="contact.html">联系</a></li>
    </ul>
  </aside>

  <main>
    <div class="hero">
      <img src="avatar.png" alt="Awen 头像" class="avatar">
      <h1>关于我</h1>
      <p>我是 Awen，一名互联网新手</p>
    </div>

    <div class="section">
      <h2>个人简介</h2>
      <p>你好，我是 Awen，目前刚开始接触互联网相关技术。这个网站是我学习网页搭建、HTML、CSS 和 GitHub Pages 的实践项目。</p>
      <p>虽然现在内容还比较简单，但我会持续更新，逐步完善主页、关于页、作品页和联系页。</p>
    </div>

    <div class="section">
      <h2>学习方向</h2>
      <p>目前主要在学习网页基础、个人网站搭建、GitHub 使用和前端入门知识。未来也会尝试记录更多学习过程和项目经验。</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Awen 的个人网站</p>
  </footer>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    menuToggle.addEventListener('click', () => {
      if (sidebar.classList.contains('open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    });

    overlay.addEventListener('click', closeSidebar);
  </script>
</body>
</html>
