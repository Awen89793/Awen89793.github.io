<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="particles"></div>

  <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">
        <img src="avatar.png" alt="头像" class="avatar">

      </div>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html">主页</a></li>
