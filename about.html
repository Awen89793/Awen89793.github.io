<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 - Awen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --sidebar-width: 50vw; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 2000; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 18px; color: var(--primary); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.2s; display: none; }
        .menu-toggle:hover { background: var(--primary); color: white; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 900; opacity: 0; visibility: hidden; transition: all 0.3s; }

        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--card); border-right: 1px solid var(--border); z-index: 1000; display: flex; flex-direction: column; padding: 40px 32px; align-items: center; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .avatar { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; margin-bottom: 20px; border: 4px solid var(--border); transition: all 0.3s; cursor: pointer; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar:hover { border-color: var(--primary); transform: scale(1.05); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        
        .sidebar .logo { font-size: 24px; font-weight: 700; color: var(--primary-dark); text-decoration: none; margin-bottom: 40px; }
        .sidebar .nav-links { display: flex; flex-direction: column; gap: 12px; list-style: none; width: 100%; }
        .sidebar .nav-links a { text-decoration: none; color: var(--muted); font-size: 18px; font-weight: 500; padding: 12px 20px; border-radius: 12px; transition: all 0.2s; display: block; text-align: center; }
        .sidebar .nav-links a:hover, .sidebar .nav-links a.active { color: var(--primary-dark); background: #eef2ff; }
        
        .main { flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; flex: 1; }
        .card { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); text-align: center; }
        .card h1 { margin-bottom: 20px; color: var(--primary-dark); }
        .card p { font-size: 18px; color: var(--muted); margin-bottom: 30px; }
        .tag { display: inline-block; background: #eef2ff; color: var(--primary-dark); padding: 6px 16px; border-radius: 20px; font-size: 14px; margin: 5px; }
        .site-footer { text-align: center; padding: 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); background: var(--card); }
        
        .sidebar.is-active { transform: translateX(0); }
        .sidebar-overlay.is-active { opacity: 1; visibility: visible; }

        @media (max-width: 768px) {
            :root { --sidebar-width: 85vw; }
            .avatar { width: 120px; height: 120px; }
            .sidebar .nav-links a { font-size: 16px; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuBtn"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" id="overlay"></div>
    
    <nav class="sidebar" id="sidebar">
        <div class="avatar">
            <img src="https://ui-avatars.com/api/?name=Awen&background=6366f1&color=fff&size=300" alt="Awen 头像">
        </div>
        <a href="index.html" class="logo">Awen</a>
        <ul class="nav-links">
            <li><a href="index.html">主页</a></li>
            <li><a href="about.html" class="active">关于</a></li>
            <li><a href="works.html">作品</a></li>
            <li><a href="contact.html">联系方式</a></li>
        </ul>
    </nav>
    
    <div class="main">
        <div class="container">
            <div class="card">
                <h1>关于我</h1>
                <p>我是一名互联网初学者，目前正充满热情地学习网页制作和互联网基础知识。</p>
                <div>
                    <span class="tag">HTML 学习</span>
                    <span class="tag">网页制作</span>
                    <span class="tag">持续进步</span>
                </div>
            </div>
        </div>
        <footer class="site-footer">网站由 GitHub 托管</footer>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        let isMenuOpen = false;
        function toggleMenuBtn() {
            if (window.innerWidth > 768 && !isMenuOpen) {
                menuBtn.style.display = 'block';
                menuBtn.addEventListener('mouseenter', openMenu);
                sidebar.addEventListener('mouseenter', openMenu);
            } else {
                menuBtn.style.display = 'none';
                menuBtn.removeEventListener('mouseenter', openMenu);
                sidebar.removeEventListener('mouseenter', openMenu);
            }
        }
        function openMenu() {
            isMenuOpen = true;
            sidebar.classList.add('is-active');
            overlay.classList.add('is-active');
            if(window.innerWidth > 768) menuBtn.style.display = 'none';
        }
        function closeMenu() {
            isMenuOpen = false;
            sidebar.classList.remove('is-active');
            overlay.classList.remove('is-active');
            toggleMenuBtn();
        }
        menuBtn.addEventListener('click', openMenu);
        overlay.addEventListener('click', closeMenu);
        document.querySelectorAll('.sidebar .nav-links a').forEach(link => link.addEventListener('click', closeMenu));
        menuBtn.addEventListener('mouseleave', () => { if(window.innerWidth > 768) closeMenu(); });
        sidebar.addEventListener('mouseleave', () => { if(window.innerWidth > 768) closeMenu(); });
        window.addEventListener('resize', toggleMenuBtn);
        toggleMenuBtn();
    </script>
</body>
</html>
